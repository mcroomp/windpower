name: Demo / GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "linkhub-ui/**"
      - "tests/sitl/copter-heli.parm"
      - "tests/sitl/rawes_common_defaults.parm"
      - "hardware/rawes_hardware_defaults.parm"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: linkhub-ui/package-lock.json
      - run: npm ci
        working-directory: linkhub-ui
      - run: npm test
        working-directory: linkhub-ui
      - run: npm run build:demo
        working-directory: linkhub-ui
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: linkhub-ui/dist-demo
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy demo
        id: deployment
        uses: actions/deploy-pages@v4
