name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-and-simtests:
    name: Unit + Simtests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: simulation/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r simulation/requirements.txt
          python -m pip install -e . --no-deps

      - name: Run unit tests
        run: |
          python -m pytest tests/unit -m "not simtest"

      - name: Run simtests
        run: |
          python -m pytest tests/simtests -m simtest

  stack-matrix:
    name: Discover stack test files
    runs-on: ubuntu-latest
    outputs:
      files: ${{ steps.discover.outputs.files }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Discover stack tests
        id: discover
        shell: bash
        run: |
          files_json=$(find tests/sitl -name 'test_*.py' | sort | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "files=${files_json}" >> "$GITHUB_OUTPUT"

  stack-build-image:
    name: Build shared stack image
    runs-on: ubuntu-latest
    needs: stack-matrix
    permissions:
      contents: read
      packages: write

    outputs:
      image_ref: ${{ steps.meta.outputs.image_ref }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image ref
        id: meta
        run: |
          owner_lc=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          image_ref="ghcr.io/${owner_lc}/windpower/rawes-sim:${{ github.sha }}"
          echo "image_ref=${image_ref}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push rawes-sim image with cache
        uses: docker/build-push-action@v6
        with:
          context: ./simulation
          target: runtime-ardupilot
          push: true
          tags: ${{ steps.meta.outputs.image_ref }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  stack-docker:
    name: Stack (Docker) - ${{ matrix.test_file }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs:
      - stack-matrix
      - stack-build-image
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        test_file: ${{ fromJson(needs.stack-matrix.outputs.files) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull shared rawes-sim image
        run: |
          docker pull "${{ needs.stack-build-image.outputs.image_ref }}"
          docker tag "${{ needs.stack-build-image.outputs.image_ref }}" rawes-sim

      - name: Make test runner executable
        run: chmod +x test.sh

      - name: Run stack test file
        shell: bash
        run: |
          test_stem="$(basename "${{ matrix.test_file }}" .py)"
          echo "Running stack file via -k prefilter: ${test_stem}"
          bash test.sh stack -n 1 -k "${test_stem}"

      - name: Upload stack logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: stack-logs-${{ strategy.job-index }}
          path: simulation/logs
          if-no-files-found: ignore
