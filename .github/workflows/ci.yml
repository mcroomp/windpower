name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Ruff + Pyright
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.7"
          python-version: "3.14.10"

      - name: Set up shared Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: uv sync --locked --dev --extra simulation

      - name: Run lint tests (Ruff + Pyright)
        run: uv run --no-sync python -m pytest tests/lint --run-lint -m lint -v

  unit-and-simtests:
    name: Unit + Simtests
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 60
    env:
      PIP_INDEX_URL: https://packagefeedproxy.microsoft.io/pypi/simple/

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.7"
          python-version: "3.14.10"

      - name: Set up shared Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: uv sync --locked --dev --extra simulation

      - name: Run unit tests
        run: |
          uv run --no-sync python -m pytest tests/unit -m "not simtest"

      - name: Run simtests
        run: |
          uv run --no-sync python -m pytest tests/simtests -m simtest

  stack-matrix:
    name: Discover stack test files
    runs-on: ubuntu-latest
    outputs:
      files: ${{ steps.discover.outputs.files }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Discover stack tests
        id: discover
        shell: bash
        run: |
          files_json=$(find tests/sitl -name 'test_*.py' | sort | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "files=${files_json}" >> "$GITHUB_OUTPUT"

  stack-build-image:
    name: Build shared stack image
    runs-on: ubuntu-latest
    needs: [lint, stack-matrix]
    permissions:
      contents: read
      packages: write

    outputs:
      image_ref: ${{ steps.meta.outputs.image_ref }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image ref
        id: meta
        run: |
          owner_lc=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          image_ref="ghcr.io/${owner_lc}/windpower/rawes-sim:${{ github.sha }}"
          echo "image_ref=${image_ref}" >> "$GITHUB_OUTPUT"
          # test.sh -> setup.sh build skips rebuilding when this label matches.
          echo "input_hash=$(bash scripts/docker_image_hash.sh)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push rawes-sim image with cache
        uses: docker/build-push-action@v6
        with:
          context: .
          file: simulation/Dockerfile
          target: runtime-ardupilot
          # Locally setup.sh tags the ArduPilot base separately; in CI one
          # BuildKit build resolves it as the in-file stage instead.
          build-args: |
            ARDUPILOT_RUNTIME_IMAGE=runtime-ardupilot-base
            RAWES_IMAGE_INPUT_HASH=${{ steps.meta.outputs.input_hash }}
          push: true
          tags: ${{ steps.meta.outputs.image_ref }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  stack-docker:
    name: Stack (Docker) - ${{ matrix.test_file }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs:
      - stack-matrix
      - stack-build-image
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        test_file: ${{ fromJson(needs.stack-matrix.outputs.files) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull shared rawes-sim image
        run: |
          docker pull "${{ needs.stack-build-image.outputs.image_ref }}"
          docker tag "${{ needs.stack-build-image.outputs.image_ref }}" rawes-sim

      - name: Make test runner executable
        run: chmod +x test.sh

      - name: Run stack test file
        shell: bash
        run: |
          test_stem="$(basename "${{ matrix.test_file }}" .py)"
          echo "Running stack file via -k prefilter: ${test_stem}"
          bash test.sh stack -n 1 -k "${test_stem}"

      - name: Upload stack logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: stack-logs-${{ strategy.job-index }}
          path: simulation/logs
          if-no-files-found: ignore
