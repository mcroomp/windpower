<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title>RAWES LinkHub</title>
  </head>
  <body>
    <main id="app">
      <section class="panel scene-panel">
        <header>
          <div>
            <p class="eyebrow">RAWES</p>
            <h1>Live vehicle state</h1>
          </div>
          <div class="link-status">
            <div id="connection-state" class="badge offline">connecting</div>
            <div id="link-throughput" title="MAVLink frame throughput, averaged over 3 seconds; excludes UART and radio overhead.">RX — · TX —</div>
          </div>
        </header>
        <div id="scene"></div>
        <div id="telemetry-overlay" class="telemetry-overlay">Waiting for telemetry…</div>
        <div id="swash-controls" class="swash-controls unavailable">
          <div class="cyclic-widget">
            <div class="instrument-title">CYCLIC</div>
            <div class="cyclic-plane">
              <span class="axis horizontal"></span>
              <span class="axis vertical"></span>
              <span id="cyclic-dot" class="instrument-dot"></span>
            </div>
            <span class="direction up">UP</span>
            <span class="direction down">DOWN</span>
            <span class="direction left">LEFT</span>
            <span class="direction right">RIGHT</span>
          </div>
          <div class="collective-widget">
            <div class="instrument-title">COLLECTIVE</div>
            <div class="collective-track">
              <span id="collective-dot" class="instrument-dot"></span>
            </div>
            <span class="direction up">UP</span>
            <span class="direction down">DOWN</span>
          </div>
          <div id="target-error-widget" class="target-error-widget unavailable">
            <div class="instrument-title">TARGET ERROR</div>
            <div class="cyclic-plane">
              <span class="axis horizontal"></span>
              <span class="axis vertical"></span>
              <span id="target-error-dot" class="instrument-dot error-dot"></span>
            </div>
            <span class="direction up">FWD</span>
            <span class="direction down">AFT</span>
            <span class="direction left">LEFT</span>
            <span class="direction right">RIGHT</span>
            <div id="target-error-value" class="instrument-value">n/a</div>
          </div>
        </div>
        <div class="control-hint">
          Passive controls: arrows roll/pitch · -/= thrust · ,/. yaw · Space recapture · Esc stop
        </div>
      </section>
      <section class="panel terminal-panel">
        <header>
          <div>
            <p class="eyebrow">CONTROL</p>
            <h2>Terminal</h2>
          </div>
          <div id="operation-state" class="badge">idle</div>
        </header>
        <div id="terminal-output" role="log" aria-live="polite"></div>
        <form id="terminal-form">
          <span aria-hidden="true">&gt;</span>
          <input
            id="terminal-input"
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
            aria-label="LinkHub command"
            placeholder="status or run passive"
          >
        </form>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
