[package]
name = "linkhub"
version = "0.1.0"
edition = "2024"
description = "Transport and diagnostic gateway for MAVLink and device links"
license = "MIT OR Apache-2.0"

[features]
default = []
bluetooth = ["dep:btleplug"]

[dependencies]
axum = "0.8"
base64 = "0.22"
btleplug = { version = "0.13", optional = true }
bytes = "1.12"
clap = { version = "4.5", features = ["derive", "env"] }
# mavlink-core 0.18's async file transport imports futures::lock::Mutex but
# does not enable the futures-util std feature itself.
futures-util = "0.3"
futures = { version = "0.3", default-features = false, features = ["alloc"] }
mavlink = { version = "0.18", default-features = false, features = ["dialect-ardupilotmega", "mav2-message-extensions", "serde", "std", "tokio"] }
num-traits = "0.2"
rmp-serde = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.48", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-serial = "5.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tower-http = { version = "0.6", features = ["fs", "set-header"] }
uuid = { version = "1.18", features = ["serde", "v4"] }

[dev-dependencies]
hex = "0.4"
tempfile = "3.23"
tokio = { version = "1.48", features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
