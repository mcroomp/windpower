[package]
name = "mavlink-protocol"
version = "0.1.0"
edition = "2024"
publish = false
description = "MAVLink codec, generated ArduPilot dialect, transactions and file/log protocol drivers"

[lib]
# The generated doc comments are XML descriptions, not Rust examples.
doctest = false

[features]
default = ["std", "serde", "mav2-message-extensions", "dialect-ardupilotmega", "protocol"]
protocol = ["codec", "dep:async-trait", "tokio/sync", "tokio/time", "tokio/macros"]
codec = ["std", "serde", "dialect-ardupilotmega", "dep:serde_json", "dep:thiserror", "dep:tokio", "dep:tracing"]
std = ["mavlink-core/std"]
serde = [
    "bitflags/serde",
    "dep:serde",
    "dep:serde_arrays",
    "mavlink-core/serde",
]
mav2-message-extensions = ["mavlink-bindgen/mav2-message-extensions"]
# Gates the generated `ardupilotmega` module (see mavlink-bindgen's binder).
dialect-ardupilotmega = []

[dependencies]
async-trait = { version = "0.1", optional = true }
bitflags = { version = "2.9.1", default-features = false }
mavlink-core = { version = "0.19.0", default-features = false, features = ["tokio"] }
num-derive = "0.4"
num-traits = { version = "0.2", default-features = false }
serde = { version = "1.0.115", features = ["derive"], optional = true }
serde_arrays = { version = "0.2.0", optional = true }
serde_json = { version = "1.0", optional = true }
thiserror = { version = "2.0", optional = true }
tokio = { version = "1.48", features = ["io-util"], optional = true }
tracing = { version = "0.1", optional = true }

[dev-dependencies]
hex = "0.4"
sha2 = "0.10"
tokio = { version = "1.48", features = ["rt", "test-util"] }

[build-dependencies]
mavlink-bindgen = { version = "0.19.0", default-features = false }

[lints.rust]
unsafe_code = "forbid"
# Referenced by the generated code, but never enabled here.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("arbitrary", "ts-rs"))'] }
