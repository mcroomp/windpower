[package]
name = "linkhub-clientgen"
version = "0.1.0"
edition = "2024"
publish = false
description = "Generates the Python and TypeScript MAVLink types from the vendored ArduPilot definitions"

[dependencies]
# Same release as the dialect crate: the parser must read the XML exactly as the generated
# Rust dialect does. `mav2-message-extensions` keeps extension fields in the model.
mavlink-bindgen = { version = "0.19.0", default-features = false, features = ["mav2-message-extensions"] }

[dev-dependencies]
linkhub-dialect = { path = "../dialect" }
serde_json = "1.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
