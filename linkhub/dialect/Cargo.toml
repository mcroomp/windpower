[package]
name = "linkhub-dialect"
version = "0.1.0"
edition = "2024"
publish = false
description = "MAVLink ardupilotmega dialect generated from ArduPilot's own pinned definitions"

[lib]
# The generated doc comments are XML descriptions, not Rust examples.
doctest = false

[features]
default = ["std", "serde", "mav2-message-extensions", "dialect-ardupilotmega"]
std = ["mavlink-core/std"]
serde = [
    "bitflags/serde",
    "dep:serde",
    "dep:serde_arrays",
    "mavlink-core/serde",
]
mav2-message-extensions = ["mavlink-bindgen/mav2-message-extensions"]
# Gates the generated `ardupilotmega` module (see mavlink-bindgen's binder).
dialect-ardupilotmega = []

[dependencies]
bitflags = { version = "2.9.1", default-features = false }
# mavlink-core's `tokio` feature uses futures::lock::Mutex without enabling futures/std
# (still true at the pinned rust-mavlink commit).
futures = { version = "0.3", default-features = false, features = ["std"] }
mavlink-core = { git = "https://github.com/mavlink/rust-mavlink", rev = "97c5d6517608d969a8e07d8f172a786ee11dbc46", default-features = false, features = ["tokio"] }
num-derive = "0.4"
num-traits = { version = "0.2", default-features = false }
serde = { version = "1.0.115", features = ["derive"], optional = true }
serde_arrays = { version = "0.2.0", optional = true }

[dev-dependencies]
sha2 = "0.10"

[build-dependencies]
# Unreleased: rust-mavlink#500 lets bindgen accept ArduPilot's definitions, where a
# 16-bit and a 32-bit field share GIMBAL_DEVICE_CAP_FLAGS. mavlink-core above is the
# same commit. Return to the crates.io release once one contains the fix (> 0.18.0).
mavlink-bindgen = { git = "https://github.com/mavlink/rust-mavlink", rev = "97c5d6517608d969a8e07d8f172a786ee11dbc46", default-features = false }

[lints.rust]
unsafe_code = "forbid"
# Referenced by the generated code, but never enabled here.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("arbitrary", "ts-rs"))'] }
