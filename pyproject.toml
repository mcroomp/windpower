[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rawes"
version = "0.1.0"
description = "RAWES tethered autorotating rotor kite -- simulation, flight-stack, and analysis tooling"
requires-python = ">=3.12"

dependencies = [
    "mcp==2.2.0",
    "pyserial",
    "pyyaml",
    "pymavlink",
]

[project.optional-dependencies]
simulation = [
    "dynbem==0.8.0",
    "imageio",
    "imageio-ffmpeg",
    "lupa",
    "matplotlib",
    "numba",
    "numpy",
    "pandas",
    "pyvista",
    "scipy",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-timeout",
]

[[tool.uv.index]]
name = "microsoft-python"
url = "https://packagefeedproxy.microsoft.io/pypi/simple/"
default = true

[tool.setuptools.packages.find]
where = ["."]
include = [
    "simulation",
    "simulation.*",
    "groundstation",
    "groundstation.*",
    "arduloop",
    "arduloop.*",
    "calibrate",
    "calibrate.*",
    "envelope",
    "envelope.*",
    "analysis",
    "analysis.*",
    "viz3d",
    "viz3d.*",
    "scripts",
    "scripts.*",
    "tests",
    "tests.*",
]

[tool.pytest.ini_options]
timeout = 600
pythonpath = ["linkhub_client/src"]
markers = [
    "simtest: full physics simulation (seconds-minutes); excluded from quick unit run",
    "sitl: ArduPilot SITL integration test (Docker); run via test.sh stack",
    "expensive: loop-heavy unit test; run explicitly with -m expensive",
]
